const VERT = `#version 300 es

const FRACTAL = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
uniform sampler2D uRef;
uniform sampler2D uBlaAB;
uniform sampler2D uBlaR;
uniform int uBlaOff[24];
uniform int uBlaLevels;
uniform float uBlaMaxR;
uniform int uRefLen;
uniform int uMaxIter;
uniform vec2 uDelta;
uniform vec2 uRefC;
uniform vec2 uPx;
uniform vec2 uRes;
uniform float uCssPx;
uniform float uDensity;
uniform bool uBulbs;
uniform bool uProbe;
out vec4 o;
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
ivec2 at(int k) { return ivec2(k & 2047, k >> 11); }
float amax(vec2 v) { v = abs(v); return max(v.x, v.y); }
void main() {
  vec2 dc = uDelta + (gl_FragCoord.xy - 0.5 * uRes) * uPx;
  if (uBulbs) {

  }
  vec2 Z = vec2(0.0), dz = vec2(0.0), z = vec2(0.0), der = vec2(0.0), dzdz = vec2(1.0, 0.0);
  int m = 0, i = 0;
  float r2 = 0.0;
  bool escaped = false, inside = false;
  float settle = 1e20;
  bool rebased = false;
  while (i < uMaxIter) {
    int step = 0;
    float adz = amax(dz) * 1.4143;
    if (m > 0 && adz < uBlaMaxR) {
      int mm = m - 1;
      for (int k = uBlaLevels - 1; k >= 0; k--) {
        int s = 1 << k;
        if ((mm & (s - 1)) != 0 || i + s > uMaxIter) continue;
        int idx = uBlaOff[k] + (mm >> k);
        if (idx >= uBlaOff[k + 1]) continue;
        if (adz < texelFetch(uBlaR, at(idx), 0).x) {
          vec4 ab = texelFetch(uBlaAB, at(idx), 0);
          der = cmul(ab.xy, der) + ab.zw * uCssPx;
          dzdz = cmul(ab.xy, dzdz);
          dz = cmul(ab.xy, dz) + cmul(ab.zw, dc);
          step = s;
          break;
        }
      }
    }
    if (step == 0) {
      der = 2.0 * cmul(z, der) + vec2(uCssPx, 0.0);
      if (i > 0) dzdz = 2.0 * cmul(z, dzdz);
      dz = cmul(2.0 * Z + dz, dz) + dc;
      step = 1;
    }
    float dd = amax(der);
    if (dd > 1e6) der *= 1e6 / dd;
    float dq = amax(dzdz);

    if (dq > 1e20) dzdz *= 1e20 / dq;

    i += step;
    Z = texelFetch(uRef, at(m), 0).xy;
    z = Z + dz;

    if (r2 > 1e6) { escaped = true; break; }
    if (amax(z) < amax(dz) || m >= uRefLen) { dz = z; m = 0; Z = vec2(0.0); rebased = true; }

  if (!escaped) { o = vec4(1.0, 0.5, 1.0, 0.5); return; }

  float nu = float(i) + 1.0 - log2(lz);
  float t = (pow(max(nu, 1.0), 0.33) - 1.2) * uDensity;
  float de = 0.5 * sqrt(r2) * lz / max(length(der), 1e-30);
  vec2 n = normalize(vec2(z.x * der.x + z.y * der.y, z.y * der.x - z.x * der.y) + 1e-30);
  float light = (dot(n, vec2(0.6, 0.8)) + 1.6) / 2.6;
  o = vec4(vec2(cos(6.2831853 * t), sin(6.2831853 * t)) * 0.5 + 0.5, 1.0 / (1.0 + de * 0.25), light);
}`;

const POST = `#version 300 es
precision highp float;
uniform sampler2D uTex;
uniform sampler2D uPal;
uniform vec2 uRes;
uniform float uDpr;
uniform float uSeed;
uniform float uPhase;
uniform float uGrain;
uniform float uPoster;
uniform vec3 uInterior;
uniform vec3 uGlow;
uniform vec3 uHalo;
out vec4 o;
float h12(vec2 p) { vec3 p3 = fract(vec3(p.xyx) * 0.1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float cover(vec4 d) { return smoothstep(0.05, 0.6, length(d.rg * 2.0 - 1.0)); }
float dist(vec4 d) { return 4.0 * (1.0 / max(d.b, 1e-3) - 1.0); }
vec3 shade(vec4 d) {
  vec2 cs = d.rg * 2.0 - 1.0;
  float t = atan(cs.y, cs.x + 1e-9) * 0.15915494 + uPhase;
  float de = dist(d);
  vec3 base = texture(uPal, vec2(t, 0.5)).rgb;
  base *= mix(0.5, 1.22, d.a) * mix(1.0, 0.6, smoothstep(8.0, 160.0, de));
  vec3 col = mix(base, uGlow, exp(-de / 0.9) * 0.85);
  return mix(uInterior, col, cover(d));
}
void main() {
  vec2 uv = gl_FragCoord.xy / uRes;
  vec2 fromC = uv - 0.5;
  vec2 ca = fromC * dot(fromC, fromC) * 0.012;
  vec4 dr = texture(uTex, uv + ca), dg = texture(uTex, uv), db = texture(uTex, uv - ca);
  vec3 col = vec3(shade(dr).r, shade(dg).g, shade(db).b);
  float halo = 0.0;
  vec2 hr = 6.0 * uDpr / uRes;
  for (int k = 0; k < 8; k++) {
    float a = float(k) * 0.7853982 + 0.4;
    vec4 d = texture(uTex, uv + vec2(cos(a), sin(a)) * hr);
    halo += exp(-dist(d) / 3.0) * cover(d);
  }
  col = mix(col, uHalo, halo / 8.0 * 0.3);
  float aspect = uRes.x / uRes.y;
  float v = length(fromC * vec2(aspect, 1.0)) / sqrt(aspect * aspect + 1.0) * 2.0;
  col *= mix(1.0, 0.55, smoothstep(0.35, 1.15, v));
  vec2 gp = gl_FragCoord.xy / (uDpr * 1.1);
  vec2 s = vec2(uSeed * 13.17, uSeed * 7.31);
  float n = h12(floor(gp) + s) + h12(floor(gp) + s.yx + 71.3) - 1.0;
  vec2 g3 = gp / 3.0 + s;
  vec2 gi = floor(g3), gf = fract(g3);
  gf = gf * gf * (3.0 - 2.0 * gf);
  float vn = mix(mix(h12(gi), h12(gi + vec2(1, 0)), gf.x), mix(h12(gi + vec2(0, 1)), h12(gi + vec2(1, 1)), gf.x), gf.y) - 0.5;
  vec3 chroma = vec3(h12(gp + s * 3.1), h12(gp + s * 5.7), h12(gp + s * 9.3)) - 0.5;
  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));
  float amp = uGrain * (0.07 + 0.16 * sqrt(lum) * (1.15 - lum));
  col += (n * 0.8 + vn * 0.9) * amp + chroma * amp * 0.35;
  if (uPoster > 0.0) col = floor(col * uPoster + 0.5 + n * 0.45) / uPoster;
  col = mix(col, 0.82 + 0.18 * (1.0 - exp(-(col - 0.82) / 0.18)), step(0.82, col));
  o = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

function compile(fragSrc) {
  const prog = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, fragSrc]]) {
    const sh = gl.createShader(type);
    gl.shaderSource(sh, src);
    gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    gl.attachShader(prog, sh);
  }
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  const uniforms = {};
  const count = gl.getProgramParameter(prog, gl.ACTIVE_UNIFORMS);
  for (let k = 0; k < count; k++) {
    const name = gl.getActiveUniform(prog, k).name;
    uniforms[name] = gl.getUniformLocation(prog, name);
  }
  return { prog, u: uniforms };
}

const fractalProg = compile(FRACTAL);
const postProg = compile(POST);
gl.bindVertexArray(gl.createVertexArray());

function makeTexture(filter) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return tex;
}

function makeTarget() {
  return { tex: makeTexture(gl.LINEAR), fbo: gl.createFramebuffer(), w: 0, h: 0 };
}

function sizeTarget(target, w, h) {
  if (target.w === w && target.h === h) return;
  target.w = w; target.h = h;
  gl.bindTexture(gl.TEXTURE_2D, target.tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target.fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, target.tex, 0);
}

const low = makeTarget();
const high = makeTarget();
const refTex = makeTexture(gl.NEAREST);
const palTex = makeTexture(gl.LINEAR);
gl.bindTexture(gl.TEXTURE_2D, palTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);

function hexRgb(hex) { const v = parseInt(hex.slice(1), 16); return [(v >> 16) & 255, (v >> 8) & 255, v & 255]; }
function srgbToLinear(c) { c /= 255; return c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function linearToSrgb(c) { return 255 * (c <= 0.0031308 ? c * 12.92 : 1.055 * Math.pow(c, 1 / 2.4) - 0.055); }

function uploadPalette(p) {
  const stops = p.stops.map(hexRgb).map((rgb) => rgb.map(srgbToLinear));
  const data = new Uint8Array(256 * 4);
  for (let k = 0; k < 256; k++) {
    const x = (k / 256) * stops.length;
    const a = Math.floor(x), f = x - a, e = f * f * (3 - 2 * f);
    const s0 = stops[a % stops.length], s1 = stops[(a + 1) % stops.length];
    for (let ch = 0; ch < 3; ch++) data[k * 4 + ch] = Math.round(linearToSrgb(s0[ch] + (s1[ch] - s0[ch]) * e));
    data[k * 4 + 3] = 255;
  }
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, data);
}

function parseFixed(str) {
  let s = String(str).trim(), neg = false;
  if (s[0] === "-" || s[0] === "+") { neg = s[0] === "-"; s = s.slice(1); }
  if (!/^\d*\.?\d*$/.test(s) || s === "" || s === ".") throw new Error("bad number");
  const [ip, fp = ""] = s.split(".");
  const v = (BigInt((ip || "0") + fp) << FRAC) / 10n ** BigInt(fp.length);
  return neg ? -v : v;
}

function formatFixed(v, digits) {
  const neg = v < 0n;
  if (neg) v = -v;
  const ip = v >> FRAC;
  const fp = ((v & ((1n << FRAC) - 1n)) * 10n ** BigInt(digits)) >> FRAC;
  return (neg ? "-" : "+") + ip.toString() + "." + fp.toString().padStart(digits, "0");
}

function fixedToNumber(v) {
  const neg = v < 0n;
  if (neg) v = -v;
  const shift = BigInt(Math.max(0, v.toString(2).length - 60));
  const x = Number(v >> shift) * 2 ** (Number(shift) - Number(FRAC));
  return neg ? -x : x;
}

function numberToFixed(x) {
  if (x === 0 || !isFinite(x)) return 0n;
  const e = Math.floor(Math.log2(Math.abs(x)));
  const mant = BigInt(Math.round(x * 2 ** (52 - e)));
  const shift = Number(FRAC) - 52 + e;
  return shift >= 0 ? mant << BigInt(shift) : mant >> BigInt(-shift);
}

function computeReference(cx, cy, iters, bits) {
  const B = BigInt(bits), sh = FRAC - B, X = cx >> sh, Y = cy >> sh, four = 4n << B, inv = 2 ** -bits;
  const rows = Math.ceil((iters + 1) / 2048);
  const data = new Float32Array(rows * 2048 * 2);
  const zx = new Float64Array(iters + 1), zy = new Float64Array(iters + 1);
  let x = 0n, y = 0n, x2 = 0n, y2 = 0n, len = iters;
  for (let n = 1; n <= iters; n++) {
    y = ((x * y) >> (B - 1n)) + Y;
    x = x2 - y2 + X;
    x2 = (x * x) >> B;
    y2 = (y * y) >> B;
    zx[n] = data[2 * n] = Number(x) * inv;
    zy[n] = data[2 * n + 1] = Number(y) * inv;
    if (x2 + y2 > four) { len = n; break; }
  }
  const usedRows = Math.ceil((len + 1) / 2048);
  gl.bindTexture(gl.TEXTURE_2D, refTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RG32F, 2048, usedRows, 0, gl.RG, gl.FLOAT, data.subarray(0, usedRows * 2048 * 2));
  return { cx, cy, len, bits, zx, zy, approx: [fixedToNumber(cx), fixedToNumber(cy)] };
}

const blaABTex = makeTexture(gl.NEAREST);
const blaRTex = makeTexture(gl.NEAREST);
let bla = { ref: null, cMax: 0, levels: 0, maxR: 0, off: new Int32Array(24) };

function buildBla(r, cMax) {
  const eps = 2 ** -24;
  const n0 = r.len - 1;
  const off = new Int32Array(24);
  let levels = 0;
  while (levels < 23 && Math.floor(n0 / 2 ** levels) >= 1) {
    off[levels + 1] = off[levels] + Math.floor(n0 / 2 ** levels);
    levels++;
  }
  for (let k = levels + 1; k < 24; k++) off[k] = off[levels];
  const total = off[levels];
  const ax = new Float64Array(total), ay = new Float64Array(total), bx = new Float64Array(total), by = new Float64Array(total), rr = new Float64Array(total);
  for (let j = 0; j < n0; j++) {
    const X = r.zx[j + 1], Y = r.zy[j + 1], az = Math.hypot(X, Y);
    ax[j] = 2 * X; ay[j] = 2 * Y; bx[j] = 1; by[j] = 0;
    rr[j] = Math.max(0, (eps * (az * 0.5 - cMax)) / (2 * az + 1));
  }
  for (let k = 1; k < levels; k++) {
    const n = off[k + 1] - off[k];
    for (let j = 0; j < n; j++) {
      const x = off[k - 1] + 2 * j, y = x + 1, d = off[k] + j;
      const Ax = ax[d] = ax[y] * ax[x] - ay[y] * ay[x];
      const Ay = ay[d] = ax[y] * ay[x] + ay[y] * ax[x];
      const Bx = bx[d] = ax[y] * bx[x] - ay[y] * by[x] + bx[y];
      const By = by[d] = ax[y] * by[x] + ay[y] * bx[x] + by[y];
      const rad = Math.min(rr[x], Math.max(0, (rr[y] - Math.hypot(bx[x], by[x]) * cMax) / Math.hypot(ax[x], ay[x])));

      rr[d] = ok ? rad : 0;
      if (!ok) { ax[d] = ay[d] = bx[d] = by[d] = 0; }
    }

  const rows = Math.max(1, Math.ceil(total / 2048));
  const abData = new Float32Array(rows * 2048 * 4), rData = new Float32Array(rows * 2048);
  let maxR = 0;
  for (let j = 0; j < total; j++) {
    abData[4 * j] = ax[j]; abData[4 * j + 1] = ay[j]; abData[4 * j + 2] = bx[j]; abData[4 * j + 3] = by[j];
    rData[j] = rr[j];
    maxR = Math.max(maxR, rData[j]);
  }
  gl.bindTexture(gl.TEXTURE_2D, blaABTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, 2048, rows, 0, gl.RGBA, gl.FLOAT, abData);
  gl.bindTexture(gl.TEXTURE_2D, blaRTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R32F, 2048, rows, 0, gl.RED, gl.FLOAT, rData);
  bla = { ref: r, cMax, levels, maxR, off };
}

const target = { x: parseFixed(TARGET.re), y: parseFixed(TARGET.im) };
const home = { x: parseFixed(HOME_RE), y: parseFixed(HOME_IM) };
const homeOff = [fixedToNumber(home.x - target.x), fixedToNumber(home.y - target.y)];
const LOG_HOME = Math.log(HOME_SIZE);
const LOG_END = Math.log(TARGET.endSize);

const view = { ax: target.x, ay: target.y, ox: homeOff[0], oy: homeOff[1], ls: LOG_HOME };
const state = { auto: true, phase: "rest", phaseTime: 0, palette: 0, grain: 2, iterMul: 1, hue: 0, cycle: true };
let ref = null;

function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  if (params.has("p")) state.palette = ((parseInt(params.get("p"), 10) || 0) % PALETTES.length + PALETTES.length) % PALETTES.length;
  if (!params.has("re") || !params.has("im") || !params.has("z")) return;
  try {
    const re = parseFixed(params.get("re")), im = parseFixed(params.get("im"));
    const zoom = parseFloat(params.get("z"));
    if (!(zoom > 0)) return;
    view.ax = re; view.ay = im; view.ox = 0; view.oy = 0;
    view.ls = Math.max(MIN_LOG_SIZE, Math.min(LOG_HOME + 1, Math.log(HOME_SIZE / zoom)));
    state.auto = false;
  } catch (e) {}
}
readHash();

let cssW = 1, cssH = 1, dpr = 1;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cssW = window.innerWidth; cssH = window.innerHeight;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
}
resize();
window.addEventListener("resize", resize);

const ITER_CAP = 200000;
const cssPx = () => Math.exp(view.ls) / Math.min(cssW, cssH);
const baselineIters = () => 300 + 200 * Math.max(0, Math.log10(HOME_SIZE / Math.exp(view.ls)));
const maxIter = () => Math.round(Math.min(ITER_CAP, Math.max(256, autoIters || baselineIters()) * state.iterMul));
let autoIters = 0;
const onTarget = () => view.ax === target.x && view.ay === target.y;
const centerFixed = () => [view.ax + numberToFixed(view.ox), view.ay + numberToFixed(view.oy)];

function ensureReference() {
  const needBits = Math.max(64, Math.ceil(-Math.log2(cssPx())) + 28);
  const reach = Math.exp(view.ls) * Math.max(cssW, cssH) / Math.min(cssW, cssH);
  if (ref) {
    const dx = fixedToNumber(view.ax - ref.cx) + view.ox;
    const dy = fixedToNumber(view.ay - ref.cy) + view.oy;
    if (Math.hypot(dx, dy) < 1.5 * reach && needBits <= ref.bits) return;
  }
  if (onTarget() && Math.hypot(view.ox, view.oy) < 1.5 * reach) {
    ref = computeReference(target.x, target.y, TARGET.period, Math.max(needBits + 16, 136));
    return;
  }
  [view.ax, view.ay] = centerFixed();
  view.ox = 0; view.oy = 0;
  ref = computeReference(view.ax, view.ay, Math.min(200000, Math.max(4096, Math.round(maxIter() * 1.25))), needBits + 16);
}

function viewDelta() {
  return [fixedToNumber(view.ax - ref.cx) + view.ox, fixedToNumber(view.ay - ref.cy) + view.oy];
}

function ensureBla() {
  const d = viewDelta();
  const cMax = Math.hypot(d[0], d[1]) + 0.5 * cssPx() * Math.hypot(cssW, cssH);
  if (bla.ref !== ref || cMax > bla.cMax || cMax < bla.cMax / 4) buildBla(ref, cMax * 1.5);
}

function offsetCurve(ls) {
  const k = Math.exp((ls - LOG_HOME) * 1.25);
  return [homeOff[0] * k, homeOff[1] * k];
}

function followCurve(prevLs, dt) {
  const prev = offsetCurve(prevLs), next = offsetCurve(view.ls);
  const decay = Math.exp(-dt * 2.2);
  view.ox = next[0] + (view.ox - prev[0]) * decay;
  view.oy = next[1] + (view.oy - prev[1]) * decay;
}

function setPhase(p) { state.phase = p; state.phaseTime = 0; }

function autopilot(dt) {
  state.phaseTime += dt;
  const prevLs = view.ls;
  const easeIn = Math.min(1, state.phaseTime / 2.5);
  if (state.phase === "return") {
    view.ls = Math.min(LOG_HOME, view.ls + 1.4 * easeIn * dt);
    const rx = fixedToNumber(view.ax - target.x) + view.ox, ry = fixedToNumber(view.ay - target.y) + view.oy;
    if (Math.hypot(rx, ry) < 5 * Math.exp(view.ls) || view.ls >= LOG_HOME) {
      view.ax = target.x; view.ay = target.y; view.ox = rx; view.oy = ry;
      setPhase(view.ls >= LOG_HOME - 0.05 ? "dive" : "rise");
    }
  } else if (state.phase === "dive") {
    const ease = Math.min(1, 0.1 + (view.ls - LOG_END) / 1.6);
    view.ls -= 0.62 * easeIn * ease * dt;
    followCurve(prevLs, dt);
    if (view.ls <= LOG_END + 0.005) setPhase("hold");
  } else if (state.phase === "hold") {
    followCurve(prevLs, dt);
    if (state.phaseTime > 7) setPhase("rise");
  } else if (state.phase === "rise") {
    const ease = Math.min(1, 0.06 + (LOG_HOME - view.ls) / 2.0);
    view.ls = Math.min(LOG_HOME, view.ls + 1.7 * easeIn * ease * dt);
    followCurve(prevLs, dt);
    if (view.ls >= LOG_HOME - 0.002) setPhase("rest");
  } else if (state.phase === "rest") {
    followCurve(prevLs, dt);
    if (state.phaseTime > 2.5) setPhase("dive");
  }
}

let zoomGoal = null;
let inertia = [0, 0];

function startAuto() {
  state.auto = true;
  setPhase(onTarget() ? "dive" : "return");
  zoomGoal = null;
  inertia = [0, 0];
  syncButtons();
  scheduleHash();
}

function stopAuto() {
  if (!state.auto) return;
  state.auto = false;
  syncButtons();
}

function clampLs(ls) { return Math.max(MIN_LOG_SIZE, Math.min(LOG_HOME + 1.5, ls)); }

function zoomAt(sx, sy, factor) {
  const px = cssPx();
  const vx = (sx - cssW / 2) * px, vy = -(sy - cssH / 2) * px;
  const newLs = clampLs(view.ls + Math.log(factor));
  const f = Math.exp(newLs - view.ls);
  view.ox += vx * (1 - f);
  view.oy += vy * (1 - f);
  view.ls = newLs;
}

function pan(dx, dy) {
  const px = cssPx();
  view.ox -= dx * px;
  view.oy += dy * px;
}

function zoomToward(x, y, deltaLs) {
  stopAuto();
  inertia = [0, 0];
  zoomGoal = { x, y, ls: clampLs((zoomGoal ? zoomGoal.ls : view.ls) + deltaLs) };
}

function manual(dt) {
  if (zoomGoal) {
    zoomAt(zoomGoal.x, zoomGoal.y, Math.exp((zoomGoal.ls - view.ls) * (1 - Math.exp(-dt * 10))));
    if (Math.abs(zoomGoal.ls - view.ls) < 1e-3) zoomGoal = null;
  }
  if (!dragging && (inertia[0] || inertia[1])) {
    pan(inertia[0] * dt, inertia[1] * dt);
    const k = Math.exp(-dt * 4);
    inertia = [inertia[0] * k, inertia[1] * k];
    if (Math.hypot(inertia[0], inertia[1]) < 2) inertia = [0, 0];
  }
}

const pointers = new Map();
let dragging = false, lastMove = 0, pinch = null;

canvas.addEventListener("pointerdown", (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  stopAuto();
  zoomGoal = null;
  inertia = [0, 0];
  dragging = true;
  canvas.classList.add("dragging");
  lastMove = performance.now();
  if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 };
  }
});

canvas.addEventListener("pointermove", (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const now = performance.now();
  if (pointers.size === 1) {
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    pan(dx, dy);
    const dt = Math.max(1, now - lastMove) / 1000;
    inertia = [inertia[0] * 0.6 + (dx / dt) * 0.4, inertia[1] * 0.6 + (dy / dt) * 0.4];
  }
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 2 && pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    pan(mx - pinch.mx, my - pinch.my);
    if (d > 0 && pinch.d > 0) zoomAt(mx, my, pinch.d / d);
    pinch = { d, mx, my };
    inertia = [0, 0];
  }
  lastMove = now;
});

function endPointer(e) {
  pointers.delete(e.pointerId);
  if (pointers.size < 2) pinch = null;
  if (pointers.size === 0) {
    dragging = false;
    canvas.classList.remove("dragging");
    if (performance.now() - lastMove > 80) inertia = [0, 0];
  }
}
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaMode === 1 ? e.deltaY * 33 : e.deltaMode === 2 ? e.deltaY * cssH : e.deltaY;
  zoomToward(e.clientX, e.clientY, delta * 0.0022);
}, { passive: false });

canvas.addEventListener("dblclick", (e) => zoomToward(e.clientX, e.clientY, Math.log(e.shiftKey ? 4 : 0.25)));

const bDive = document.getElementById("bDive");
const bPal = document.getElementById("bPal");
const bGrain = document.getElementById("bGrain");
const bSave = document.getElementById("bSave");

function syncButtons() {
  bDive.classList.toggle("on", state.auto);
  bDive.textContent = state.auto ? "diving" : "dive";
  bPal.textContent = PALETTES[state.palette].name;
  bGrain.textContent = "grain " + ["off", "low", "mid", "high"][state.grain];
}

function setPalette(k) {
  state.palette = (k + PALETTES.length) % PALETTES.length;
  uploadPalette(PALETTES[state.palette]);
  syncButtons();
  scheduleHash();
}

function cycleGrain() {
  state.grain = (state.grain + 1) % GRAIN_LEVELS.length;
  syncButtons();
}

function save() {
  draw();
  canvas.toBlob((blob) => {
    if (!blob) return;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `mandelbrot-${(HOME_SIZE / Math.exp(view.ls)).toExponential(2).replace("+", "")}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, "image/png");
}

bDive.addEventListener("click", () => (state.auto ? stopAuto() : startAuto()));
bPal.addEventListener("click", (e) => setPalette(state.palette + (e.shiftKey ? -1 : 1)));
bGrain.addEventListener("click", cycleGrain);
bSave.addEventListener("click", save);

window.addEventListener("keydown", (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === " ") { e.preventDefault(); state.auto ? stopAuto() : startAuto(); }
  else if (k === "p") setPalette(state.palette + (e.shiftKey ? -1 : 1));
  else if (k === "g") cycleGrain();
  else if (k === "c") state.cycle = !state.cycle;
  else if (k === "h") document.body.classList.toggle("hidden");
  else if (k === "s") save();
  else if (k === "[") state.iterMul = Math.max(0.25, state.iterMul / 1.4);
  else if (k === "]") state.iterMul = Math.min(8, state.iterMul * 1.4);
  else if (k === "=" || k === "+") zoomToward(cssW / 2, cssH / 2, -0.7);
  else if (k === "-") zoomToward(cssW / 2, cssH / 2, 0.7);
  else if (k === "r") {
    stopAuto();
    view.ax = target.x; view.ay = target.y; view.ox = homeOff[0]; view.oy = homeOff[1]; view.ls = LOG_HOME;
    zoomGoal = null; inertia = [0, 0];
  }
});

let hashTimer = 0;
function scheduleHash() {
  clearTimeout(hashTimer);
  hashTimer = setTimeout(() => {
    const params = new URLSearchParams();
    if (!state.auto) {
      const c = centerFixed();
      const digits = Math.min(56, Math.max(6, Math.ceil(-Math.log10(cssPx())) + 3));
      params.set("re", formatFixed(c[0], digits).replace("+", ""));
      params.set("im", formatFixed(c[1], digits).replace("+", ""));
      params.set("z", (HOME_SIZE / Math.exp(view.ls)).toPrecision(4));
    }
    if (state.palette) params.set("p", String(state.palette));
    const str = params.toString();
    history.replaceState(null, "", str ? "#" + str : location.pathname + location.search);
  }, 400);
}

const SUP = { "0": "⁰", "1": "¹", "2": "²", "3": "³", "4": "⁴", "5": "⁵", "6": "⁶", "7": "⁷", "8": "⁸", "9": "⁹", "-": "⁻" };
function formatZoom(z) {
  if (z < 1000) return z.toFixed(z < 10 ? 2 : 0) + "×";
  const e = Math.floor(Math.log10(z));
  return (z / 10 ** e).toFixed(2) + " × 10" + String(e).split("").map((ch) => SUP[ch]).join("");
}

let hudClock = 0;
function updateHud(now, iters) {
  if (now - hudClock < 120) return;
  hudClock = now;
  const c = centerFixed();
  const digits = Math.min(40, Math.max(6, Math.ceil(-Math.log10(cssPx())) + 2));
  const group = (s) => s.replace(/(\.\d*)/, (m) => m.replace(/(\d{3})(?=\d)/g, "$1 "));
  hud.innerHTML =
    `<b>re</b>${group(formatFixed(c[0], digits))}\n` +
    `<b>im</b>${group(formatFixed(c[1], digits))}\n` +
    `<b>zoom</b>${formatZoom(HOME_SIZE / Math.exp(view.ls))}\n` +
    `<b>iter</b>${iters.toLocaleString("en-US")}`;
}

let renderScale = 0.5;
let lastView = null;
let viewStamp = 0;
let staticSince = 0;
let refine = { row: 0, rows: 48, done: false, active: false };
let frameEma = 16;
let lastRenderLow = false;
let seed = 0, seedClock = 0;
let lastFrame = performance.now();
let currentIters = 0;

function viewChanged() {
  const cur = { ax: view.ax, ay: view.ay, ox: view.ox, oy: view.oy, ls: view.ls, w: canvas.width, h: canvas.height, it: currentIters, r: ref, b: bla };
  const prev = lastView;
  lastView = cur;
  return !prev || Object.keys(cur).some((k) => cur[k] !== prev[k]);
}

function renderFractal(dest, w, h, rows, iters = currentIters, isProbe = false) {
  sizeTarget(dest, w, h);
  const p = fractalProg;
  gl.useProgram(p.prog);
  gl.bindFramebuffer(gl.FRAMEBUFFER, dest.fbo);
  gl.viewport(0, 0, w, h);
  if (rows) { gl.enable(gl.SCISSOR_TEST); gl.scissor(0, rows[0], w, rows[1]); }
  const px = cssPx();
  const d = viewDelta();
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, refTex);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, blaABTex);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, blaRTex);
  gl.uniform1i(p.u.uRef, 0);
  gl.uniform1i(p.u.uBlaAB, 1);
  gl.uniform1i(p.u.uBlaR, 2);
  gl.uniform1iv(p.u["uBlaOff[0]"], bla.off);
  gl.uniform1i(p.u.uBlaLevels, bla.levels);
  gl.uniform1f(p.u.uBlaMaxR, bla.maxR);
  gl.uniform1i(p.u.uProbe, isProbe ? 1 : 0);
  gl.uniform1i(p.u.uRefLen, ref.len);
  gl.uniform1i(p.u.uMaxIter, iters);
  gl.uniform2f(p.u.uDelta, d[0], d[1]);
  gl.uniform2f(p.u.uRefC, ref.approx[0], ref.approx[1]);
  gl.uniform2f(p.u.uPx, (px * cssW) / w, (px * cssH) / h);
  gl.uniform2f(p.u.uRes, w, h);
  gl.uniform1f(p.u.uCssPx, px);
  gl.uniform1f(p.u.uDensity, 0.12);
  gl.uniform1i(p.u.uBulbs, Math.exp(view.ls) > 1e-4 ? 1 : 0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.disable(gl.SCISSOR_TEST);
}

function draw() {
  const pal = PALETTES[state.palette];
  const p = postProg;
  const rgb = (hex) => hexRgb(hex).map((v) => v / 255);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(p.prog);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, refine.done ? high.tex : low.tex);
  gl.uniform1i(p.u.uTex, 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  gl.uniform1i(p.u.uPal, 1);
  gl.uniform2f(p.u.uRes, canvas.width, canvas.height);
  gl.uniform1f(p.u.uDpr, dpr);
  gl.uniform1f(p.u.uSeed, seed);
  gl.uniform1f(p.u.uPhase, state.hue);
  gl.uniform1f(p.u.uGrain, GRAIN_LEVELS[state.grain] * pal.grain);
  gl.uniform1f(p.u.uPoster, pal.poster);
  gl.uniform3fv(p.u.uInterior, rgb(pal.interior));
  gl.uniform3fv(p.u.uGlow, rgb(pal.glow));
  gl.uniform3fv(p.u.uHalo, rgb(pal.halo));
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}

const probe = { target: makeTarget(), pbo: gl.createBuffer(), sync: null, data: null, w: 0, h: 0, max: 0, last: -1e9, stamp: -1 };

function startProbe(now) {
  if (probe.sync || now - probe.last < 280 || probe.stamp === viewStamp) return;
  probe.stamp = viewStamp;
  probe.last = now;
  probe.w = 64;
  probe.h = Math.max(8, Math.round((64 * canvas.height) / canvas.width));
  probe.max = Math.min(ITER_CAP, Math.max(8192, currentIters * 4));
  renderFractal(probe.target, probe.w, probe.h, null, probe.max, true);
  const bytes = probe.w * probe.h * 4;
  if (!probe.data || probe.data.length !== bytes) probe.data = new Uint8Array(bytes);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probe.pbo);
  gl.bufferData(gl.PIXEL_PACK_BUFFER, bytes, gl.STREAM_READ);
  gl.readPixels(0, 0, probe.w, probe.h, gl.RGBA, gl.UNSIGNED_BYTE, 0);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  probe.sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  gl.flush();
}

function finishProbe() {
  if (!probe.sync || gl.getSyncParameter(probe.sync, gl.SYNC_STATUS) !== gl.SIGNALED) return;
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, probe.pbo);
  gl.getBufferSubData(gl.PIXEL_PACK_BUFFER, 0, probe.data);
  gl.bindBuffer(gl.PIXEL_PACK_BUFFER, null);
  gl.deleteSync(probe.sync);
  probe.sync = null;
  const counts = [];
  for (let k = 0; k < probe.data.length; k += 4) {
    if (probe.data[k + 3] > 127) counts.push(probe.data[k] | (probe.data[k + 1] << 8) | (probe.data[k + 2] << 16));
  }
  if (!counts.length) return;
  counts.sort((a, b) => a - b);
  const want = Math.min(ITER_CAP, Math.max(256, Math.ceil(counts[Math.floor(counts.length * 0.985)] * 1.2) + 64));
  const cur = autoIters || baselineIters();
  if (want > cur * 1.1 || want < cur * 0.6) autoIters = want;
}

function frame(now) {
  const dt = Math.min(0.1, Math.max(0, (now - lastFrame) / 1000));
  lastFrame = now;
  if (lastRenderLow) frameEma = frameEma * 0.85 + dt * 1000 * 0.15;

  if (state.auto) autopilot(dt); else manual(dt);
  if (state.cycle) state.hue = (state.hue + dt * 0.012) % 1;
  seedClock += dt;
  if (seedClock > 1 / 24) { seedClock = 0; seed = (seed + 1) % 997; }

  ensureReference();
  ensureBla();
  finishProbe();
  currentIters = maxIter();

  lastRenderLow = false;
  if (viewChanged()) {
    if (frameEma > 26) renderScale = Math.max(0.16, renderScale * 0.9);
    else if (frameEma < 19) renderScale = Math.min(0.75, renderScale * 1.05);
    renderFractal(low, Math.max(16, Math.round(canvas.width * renderScale)), Math.max(16, Math.round(canvas.height * renderScale)), null);
    lastRenderLow = true;
    viewStamp++;
    staticSince = now;
    refine = { row: 0, rows: refine.rows, done: false, active: false };
    if (!state.auto) scheduleHash();
  } else if (!refine.done && now - staticSince > 220) {
    const hiScale = Math.min(1, Math.sqrt(4.2e6 / (canvas.width * canvas.height)));
    const w = Math.round(canvas.width * hiScale), h = Math.round(canvas.height * hiScale);
    if (refine.active && dt > 0.045) refine.rows = Math.max(8, Math.floor(refine.rows / 2));
    else if (refine.active && dt < 0.024) refine.rows = Math.min(h, Math.ceil(refine.rows * 1.5));
    const rows = Math.min(refine.rows, h - refine.row);
    renderFractal(high, w, h, [refine.row, rows]);
    refine.active = true;
    refine.row += rows;
    if (refine.row >= h) refine.done = true;
  }
  startProbe(now);
  draw();
  updateHud(now, currentIters);
  requestAnimationFrame(frame);
}

canvas.addEventListener("webglcontextlost", (e) => { e.preventDefault(); document.body.classList.add("nogl"); });

uploadPalette(PALETTES[state.palette]);
syncButtons();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
